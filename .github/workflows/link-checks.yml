name: CLIQUE secure link contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/clique-link/**'
      - 'src/app/api/apps/**'
      - 'src/app/apps/**'
      - 'migrations/20261102_clique_account_linking.sql'
      - 'tests/sql/**'
      - 'tests/clique-link-policy.test.mjs'
      - 'package.json'
      - '.github/workflows/link-checks.yml'
      - 'src/components/NavBar.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:link
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: HTTP smoke test: linking remains disabled without approved configuration
        run: bash scripts/smoke-link-disabled.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ephemeral-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Verify privileges and one-use link transactions in ephemeral database
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/link-db-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f migrations/20261102_clique_account_linking.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/link-db-integration.sql
